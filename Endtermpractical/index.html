
<!DOCTYPE html>
<html>
<head>
    <title>Even and Odd Number Checker</title>
</head>

<body style="font-family:Arial; background-color:#f2f2f2;">

    <h2 style="text-align:center; color:blue;">
        Even and Odd Number Checker
    </h2>

    <div style="width:350px; margin:auto; background:white; padding:20px;
    border-radius:10px; box-shadow:0px 0px 10px gray;">

        <label>Enter a Number:</label><br><br>

        <input type="number" id="num"
        style="width:100%; padding:8px;"><br><br>

        <button onclick="checkNumber()"
        style="padding:10px 20px; background:green;
        color:white; border:none; cursor:pointer;">
            Check
        </button>

        <h3 id="result" style="color:red;"></h3>

    </div>

    <script>

        function checkNumber()
        {
            var number = document.getElementById("num").value;

            if(number == "")
            {
                document.getElementById("result").innerHTML =
                "Please enter a number!";
            }
            else if(number % 2 == 0)
            {
                document.getElementById("result").innerHTML =
                number + " is an Even Number.";
            }
            else
            {
                document.getElementById("result").innerHTML =
                number + " is an Odd Number.";
            }
        }

    </script>

</body>
</html>
